# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- build
- test
- secret-detection
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
  ZIG_VERSION: 0.16.0
  # From https://ziglang.org/download/index.json (x86_64-linux tarball).
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
secret_detection:
  stage: secret-detection

# Zig build: cross-compiles all three targets on Linux (KAT-7).
zig-build:
  stage: build
  image: python:3.13-slim
  before_script:
  - apt-get update -qq && apt-get install -y -qq xz-utils curl binutils >/dev/null
  - curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz
  - echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
  - tar -xJf /tmp/zig.tar.xz -C /opt && export PATH=/opt/zig-x86_64-linux-$ZIG_VERSION:$PATH
  script:
  - zig version
  - zig build -Dtarget=x86_64-linux-musl -Doptimize=ReleaseSmall -Dstrip=true --prefix zig-out/linux-x64
  - zig build -Dtarget=aarch64-macos -Doptimize=ReleaseSmall -Dstrip=true --prefix zig-out/macos-arm64
  - zig build -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSmall -Dstrip=true --prefix zig-out/windows-x64
  - python tests/cross-artifacts.py
  artifacts:
    paths:
    - zig-out/linux-x64/bin/kata
    - zig-out/macos-arm64/bin/kata
    - zig-out/windows-x64/bin/kata.exe
    expire_in: 1 week

linux-smoke:
  stage: test
  image: python:3.13-slim
  needs: [zig-build]
  script:
  - python tests/target-smoke.py "$CI_PROJECT_DIR/zig-out/linux-x64/bin/kata"
  - KATA_BIN="$CI_PROJECT_DIR/zig-out/linux-x64/bin/kata" python tests/color-fallback-pty.py

# GitLab SaaS macOS runners are not available to this account
# (no_matching_runner), so the real macOS run lives in
# .github/workflows/macos-smoke.yml on a GitHub mirror. Kept here as an
# optional manual job in case runners become available.
macos-smoke:
  stage: test
  when: manual
  allow_failure: true
  tags: [saas-macos-medium-m1]
  image: macos-14-xcode-15
  needs: [zig-build]
  script:
  - chmod +x zig-out/macos-arm64/bin/kata
  - python3 tests/target-smoke.py "$CI_PROJECT_DIR/zig-out/macos-arm64/bin/kata"
  - KATA_BIN="$CI_PROJECT_DIR/zig-out/macos-arm64/bin/kata" python3 tests/color-fallback-pty.py

# First native Windows execution of Kata. Needs GitLab SaaS Windows runners.
windows-smoke:
  stage: test
  tags: [saas-windows-medium-amd64]
  needs: [zig-build]
  script:
  - python tests/target-smoke.py "$env:CI_PROJECT_DIR\zig-out\windows-x64\bin\kata.exe"
