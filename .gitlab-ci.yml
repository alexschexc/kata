# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- build
- test
- secret-detection
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
  ZIG_VERSION: 0.16.0
  # From https://ziglang.org/download/index.json (x86_64-linux tarball).
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  RUST_VERSION: 1.98.0
  CARGO_ZIGBUILD_VERSION: 0.23.4
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
secret_detection:
  stage: secret-detection

# The Zig implementation is frozen at tag V0.3.1 and no longer built here. macOS is verified on
# a native runner in .github/workflows/macos-smoke.yml (GitLab SaaS has no macOS runner for this
# account); Windows is also covered by .github/workflows/windows-smoke.yml.

# ---- Rust port (Linear project "Port Kata to Rust") ----

# Formatting, lints and unit tests. Runs on every pipeline.
rust-test:
  stage: test
  image: rust:$RUST_VERSION-slim
  cache:
    key: rust-test-$RUST_VERSION
    paths: [.cargo-home/registry, rust/target]
  script:
  - apt-get update -qq && apt-get install -y -qq python3 >/dev/null
  - cd rust
  - rustup component add rustfmt clippy
  - cargo fmt --all --check
  - cargo clippy --locked --all-targets -- -D warnings
  - cargo test --locked
  - cargo build --locked --example term_probe
  - cd .. && python3 tests/term-pty.py

# Cross-build all release targets from Linux; Zig is only the linker (cargo-zigbuild).
rust-build:
  stage: build
  image: rust:$RUST_VERSION
  cache:
    key: rust-build-$RUST_VERSION-zigbuild-$CARGO_ZIGBUILD_VERSION
    paths: [.cargo-home/registry, .cargo-home/bin]
  before_script:
  - apt-get update -qq && apt-get install -y -qq xz-utils curl binutils >/dev/null
  - curl -fsSL -o /tmp/zig.tar.xz https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz
  - echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c -
  - tar -xJf /tmp/zig.tar.xz -C /opt && export PATH=/opt/zig-x86_64-linux-$ZIG_VERSION:$CARGO_HOME/bin:$PATH
  - command -v cargo-zigbuild >/dev/null || cargo install cargo-zigbuild --version $CARGO_ZIGBUILD_VERSION --locked
  script:
  - scripts/rust-cross-build.sh
  artifacts:
    paths:
    - rust/target/x86_64-unknown-linux-musl/release/kata
    - rust/target/aarch64-apple-darwin/release/kata
    - rust/target/x86_64-pc-windows-gnu/release/kata.exe
    expire_in: 1 week

# Inspect the cross-built binaries. The byte-for-byte comparison with the Zig build
# (tests/rust-dump-diff.py against tag V0.3.1) needs a Zig build of that tag and is run locally.
rust-verify:
  stage: test
  image: python:3.13-slim
  needs: [rust-build]
  before_script:
  - apt-get update -qq && apt-get install -y -qq binutils file >/dev/null
  script:
  - python tests/rust-cross-artifacts.py --expect-corpora
  - python tests/provenance-check.py "$CI_PROJECT_DIR/rust/target/x86_64-unknown-linux-musl/release/kata"
  - python tests/provenance-check.py "$CI_PROJECT_DIR/rust/target/aarch64-apple-darwin/release/kata" --no-run
  - python tests/provenance-check.py "$CI_PROJECT_DIR/rust/target/x86_64-pc-windows-gnu/release/kata.exe" --no-run
  - python tests/target-smoke.py "$CI_PROJECT_DIR/rust/target/x86_64-unknown-linux-musl/release/kata"
  - KATA_BIN="$CI_PROJECT_DIR/rust/target/x86_64-unknown-linux-musl/release/kata" python tests/color-fallback-pty.py

# Native Windows execution of the Rust build.
rust-windows-smoke:
  stage: test
  tags: [saas-windows-medium-amd64]
  needs: [rust-build]
  script:
  - python tests/target-smoke.py "$env:CI_PROJECT_DIR\rust\target\x86_64-pc-windows-gnu\release\kata.exe"
