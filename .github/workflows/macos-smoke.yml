# Native macOS arm64 verification of the Rust build (KAT-7, KAT-32). GitLab SaaS has no macOS runner for
# this account, so this workflow runs from a GitHub mirror of the repository.
name: macos-smoke
on:
  push:
  workflow_dispatch:

jobs:
  rust-macos-arm64:
    # Native build of the Rust port (no Zig, no cross-compilation) on Apple silicon.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        working-directory: rust
        run: cargo build --release --locked
      - name: Test
        working-directory: rust
        run: cargo test --locked
      - name: Smoke test
        run: python3 tests/target-smoke.py "$GITHUB_WORKSPACE/rust/target/release/kata"
      - name: Provenance
        run: python3 tests/provenance-check.py "$GITHUB_WORKSPACE/rust/target/release/kata"
      - name: Linked libraries (PACKAGING.md claim)
        run: |
          otool -L "$GITHUB_WORKSPACE/rust/target/release/kata" | tee /tmp/otool.txt
          # Only system libraries may appear.
          ! tail -n +2 /tmp/otool.txt | grep -vE '^\s+(/usr/lib/|/System/Library/)'
      - name: Colour fallback (Terminal.app)
        run: KATA_BIN="$GITHUB_WORKSPACE/rust/target/release/kata" python3 tests/color-fallback-pty.py
      - name: Terminal layer PTY
        run: KATA_BIN="$GITHUB_WORKSPACE/rust/target/release/kata" python3 tests/term-pty.py
      - name: Keep the binary
        uses: actions/upload-artifact@v4
        with:
          name: kata-macos-arm64
          path: rust/target/release/kata
          retention-days: 14
